<!doctype html>
<script type="module" crossorigin src="./assets/capture-D3SE_Ui7.js"></script>
<link rel="modulepreload" crossorigin href="./assets/input-DiRk8YQm.js">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Jolt Motion Lab</title>
<style>
  html,body{margin:0;min-height:100%;background:#06070b;color:#fff;
    font-family:ui-rounded,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  main{display:flex;flex-direction:column;gap:14px;padding:max(20px,env(safe-area-inset-top)) 20px 40px;max-width:520px;margin:0 auto}
  h1{font-size:22px;margin:6px 0 0}
  p{opacity:.8;line-height:1.5;margin:0}
  button{font:700 17px inherit;color:#06070b;background:#ffd76b;border:0;border-radius:12px;
    padding:16px;width:100%}
  button:disabled{opacity:.4}
  #stage{font-size:28px;font-weight:800;text-align:center;padding:26px 10px;border:2px solid #2a2f45;
    border-radius:16px;min-height:70px;display:grid;place-items:center}
  #live{font:600 14px ui-monospace,monospace;opacity:.85;white-space:pre-line;min-height:64px}
  #fired{color:#5ce88f;font-weight:800}
  textarea{width:100%;height:120px;background:#11131f;color:#9fb;border:1px solid #2a2f45;border-radius:10px;font:11px ui-monospace,monospace}
</style>
<main>
  <h1>Jolt Motion Lab</h1>
  <p>Records your phone's REAL motion so the shake detector can be tuned against reality
     instead of synthetic guesses. It runs the actual game recogniser live — watch which
     of your shakes it catches. ~60 seconds total.</p>
  <button id="go">START (allows motion access)</button>
  <div id="stage">—</div>
  <div id="live"></div>
  <button id="copy" disabled>COPY TRACE</button>
  <textarea id="out" readonly placeholder="trace appears here — paste it back to Claude"></textarea>
</main>
